<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>评论区互动 · Design System</title>
<link rel="stylesheet" href="dist/rds.css?v=10">
<style>
/* 文档站自己的样式（原型样式里有整页设置，这里覆盖回来） */
html,body{height:auto!important;overflow:auto!important}
body{background:#fff!important;color:#171717!important;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased;margin:0}
a{color:inherit}
.top{position:sticky;top:0;z-index:100;height:56px;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid #EAEAEA;background:rgba(255,255,255,.9);backdrop-filter:blur(8px)}
.top b{font-size:14px;font-weight:600}
.top span{font-size:12px;color:#8F8F8F;border:1px solid #EAEAEA;border-radius:999px;padding:1px 8px}
.wrap{display:grid;grid-template-columns:240px minmax(0,1fr);max-width:1280px;margin:0 auto}
nav{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;padding:24px 16px 40px 24px;border-right:1px solid #EAEAEA;box-sizing:border-box}
nav .grp+.grp{margin-top:4px}
nav .h{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;font-size:13px;color:#4D4D4D;font-weight:500;cursor:pointer}
nav .h:hover{background:#F5F5F5}
nav .h::before{content:"";width:5px;height:5px;border-right:1.5px solid #A1A1A1;border-bottom:1.5px solid #A1A1A1;transform:rotate(-45deg);transition:transform .2s;margin:0 2px}
nav .grp.open .h::before{transform:rotate(45deg)}
nav .h span{flex:1}
nav .h em{font-style:normal;font-size:12px;color:#A1A1A1;font-weight:400}
nav .ls{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.32,.72,0,1)}
nav .grp.open .ls{grid-template-rows:1fr}
nav .ls .in{min-height:0;overflow:hidden;padding-left:14px}
nav .ls .in::after{content:"";display:block;height:8px}
nav .ls a{opacity:0;transform:translateY(-4px);transition:opacity .18s ease,transform .24s cubic-bezier(.32,.72,0,1),background .15s,color .15s}
nav .grp.open .ls a{opacity:1;transform:none;transition-delay:calc(var(--i) * 18ms + 40ms),calc(var(--i) * 18ms + 40ms),0s,0s}
nav .h{transition:background .15s}
nav .h:active{transform:scale(.99)}
nav .h em{transition:opacity .2s}
nav .grp.open .h em{opacity:0}
#page.enter{animation:pgin .28s cubic-bezier(.32,.72,0,1)}
@keyframes pgin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){nav .ls,nav .ls a,#page.enter{transition:none!important;animation:none!important}}
nav a{display:flex;will-change:transform;justify-content:space-between;align-items:center;font-size:14px;color:#4D4D4D;text-decoration:none;padding:6px 8px;border-radius:6px}
nav a small{font-size:12px;color:#A1A1A1}
nav a:hover{background:#F5F5F5;color:#171717}
nav a.on{background:#F2F2F2;color:#171717;font-weight:500}
main{padding:48px 56px 160px;min-width:0;max-width:880px;box-sizing:border-box}
@media(max-width:900px){.wrap{grid-template-columns:1fr}nav{display:none}main{padding:28px 18px 120px}}
h1{font-size:32px;line-height:1.25;font-weight:600;letter-spacing:-.01em;margin:0 0 10px}
h1 small{font-size:16px;color:#8F8F8F;font-weight:400;margin-left:10px;letter-spacing:0}
.lead{font-size:16px;line-height:1.7;color:#4D4D4D;margin:0 0 36px}
h2{font-size:20px;font-weight:600;margin:48px 0 6px}
h2+p,.sec>p{font-size:14px;line-height:1.7;color:#666;margin:0 0 14px}
code{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.92em}
p code,td code,li code{background:#F5F5F5;border:1px solid #EAEAEA;border-radius:5px;padding:0 5px}
/* 示例框：上面看组件，下面一条「代码」可以展开 */
.ex{border:1px solid #EAEAEA;border-radius:12px;overflow:hidden;background:#fff}
.ex .pv{background:#fff;padding:36px 28px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:28px}
.ex .pv.c{justify-content:center;align-items:center}
.ex .pv.col{flex-direction:column;align-items:flex-start}
.ex .pv figure{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.ex .pv figcaption{font-size:12px;color:#8F8F8F}
.ex .pv .card{box-shadow:0 0 0 1px #EBEBEB;border-radius:4px;background:#fff}
.ex details summary{list-style:none;display:flex;align-items:center;gap:6px;padding:10px 16px;border-top:1px solid #EAEAEA;font-size:13px;color:#666;cursor:pointer;user-select:none}
.ex details summary::-webkit-details-marker{display:none}
.ex details summary::before{content:"";width:6px;height:6px;border-right:1.5px solid #8F8F8F;border-bottom:1.5px solid #8F8F8F;transform:rotate(-45deg);transition:transform .2s;margin-right:4px}
.ex details[open] summary::before{transform:rotate(45deg)}
.ex details summary:hover{color:#171717}
.ex .cw{position:relative;border-top:1px solid #EAEAEA;background:#FAFAFA}
.ex pre{margin:0;padding:16px 18px;font-size:12.5px;line-height:1.7;overflow:auto;color:#171717}
.cp{position:absolute;right:10px;top:10px;font-size:12px;border:1px solid #EAEAEA;background:#fff;border-radius:6px;padding:3px 9px;cursor:pointer;color:#4D4D4D}
pre.blk{background:#FAFAFA;border:1px solid #EAEAEA;border-radius:12px;padding:16px 18px;font-size:12.5px;line-height:1.7;overflow:auto;margin:0 0 16px;position:relative}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #EAEAEA;vertical-align:top;line-height:1.6}
th{color:#8F8F8F;font-weight:500}
td:first-child code{color:#171717}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{border:1px solid #EAEAEA;border-radius:12px;overflow:hidden;font-size:12px;color:#666;background:#fff}
.tile i{display:block;height:56px}
.tile div{padding:10px 12px;line-height:1.55}
.tile b{color:#171717;font-weight:500}
.ics{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.ics div{border:1px solid #EAEAEA;border-radius:12px;padding:16px 8px 12px;text-align:center;font-size:11px;color:#666}
.ics .ib{display:grid;place-items:center;height:28px;margin-bottom:8px}
.ics em{display:block;font-style:normal;color:#A1A1A1;margin-top:2px}
.btn{height:30px;padding:0 12px;border-radius:6px;font-size:13px;background:#fff;color:#171717;border:1px solid #EAEAEA;cursor:pointer}
.btn:hover{background:#F5F5F5}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.frame{position:relative;background:#fff;overflow:hidden;border-radius:8px;box-shadow:0 0 0 1px #EBEBEB}
.steps{padding-left:20px;margin:0 0 16px;font-size:14px;line-height:1.9;color:#333}
.note{font-size:13px;color:#8F8F8F;margin-top:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cards a{display:block;border:1px solid #EAEAEA;border-radius:12px;padding:16px;text-decoration:none}
.cards a:hover{border-color:#C9C9C9}
.cards b{display:block;font-size:14px;font-weight:500;margin-bottom:4px}
.use{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:-12px 0 8px}
.use>div{border:1px solid #EAEAEA;border-radius:12px;padding:14px 18px}
.use b{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.use b::before{content:"";width:8px;height:8px;border-radius:50%;background:#171717}
.use .no b::before{background:#fff;box-shadow:inset 0 0 0 1.5px #FF2442}
.use ul{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.8;color:#4D4D4D}
@media(max-width:700px){.use{grid-template-columns:1fr}}
.dd2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1100px){.dd2{grid-template-columns:1fr}}
.dd{border:1px solid #EAEAEA;border-radius:12px;overflow:hidden}
.dd .pv{padding:24px 18px;display:flex;justify-content:center;background:#FAFAFA;min-height:120px;align-items:center;overflow:hidden}
.dd .pv>*{max-width:100%;zoom:.86}
.dd .vd{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-top:1px solid #EAEAEA;font-size:13px;font-weight:500}
.dd .vd span{font-weight:400;color:#666}
.dd.dd-yes .vd::before{content:"✓";color:#171717}
.dd.dd-no{border-color:#FFD0D7}
.dd.dd-no .vd{color:#E5223C}
.dd.dd-no .vd::before{content:"✕"}
.obs{margin:0;padding-left:20px;font-size:14px;line-height:1.8;color:#333}
.obs li{margin-bottom:8px}
.shots3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.shots3 figure{margin:0;display:grid;gap:8px}
.shots3 img{width:100%;border-radius:10px;box-shadow:0 0 0 1px #EAEAEA}
.shots3 figcaption{font-size:13px;font-weight:500;text-align:center}
.mt-bar{display:flex;justify-content:flex-end;margin:-6px 0 12px;font-size:13px;color:#4D4D4D}
.mt-bar label{display:flex;align-items:center;gap:6px;cursor:pointer}
.mt-grid{display:grid;grid-template-columns:1fr;gap:12px}
.mt-card{border:1px solid #EAEAEA;border-radius:12px;padding:16px 18px;background:#fff}
.mt-head{display:flex;gap:10px;align-items:baseline;font-size:13px;flex-wrap:wrap}
.mt-head code{color:#666}
.mt-use{font-size:12.5px;color:#8F8F8F;margin:4px 0 12px}
.mt-use code{background:#F5F5F5;border:1px solid #EAEAEA;border-radius:5px;padding:0 5px}
.mt-body{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.mt-gw{position:relative;width:150px;height:150px;flex:none;background:#FAFAFA;border-radius:10px}
.mt-graph{display:block;overflow:visible}
.mt-trace{position:absolute}
.mt-trace .mx{position:absolute;left:0;bottom:0;width:0;height:0}
.mt-trace .my{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#171717;box-shadow:0 0 0 3px #fff}
.mt-scene{flex:1;min-width:220px;height:150px;background:#F5F5F5;border-radius:10px;position:relative;overflow:hidden;display:grid;place-items:center}
.mt-ph{position:relative;width:200px;height:128px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px #EBEBEB}
.mt-ph i{display:block;height:7px;border-radius:4px;background:#EDEDED}
.mt-lines{padding:14px;display:grid;gap:8px}
.mt-lines i:nth-child(1){width:70%}.mt-lines i:nth-child(2){width:90%}.mt-lines i:nth-child(3){width:55%}
.mt-ph .av{width:24px;height:24px;border-radius:50%;background:#E3E3E3;flex:none}
.mt-banner{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:8px;align-items:center;padding:9px;background:#fff;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.mt-banner div,.mt-cmt div{display:grid;gap:6px}
.mt-dim{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.mt-sheet{position:absolute;left:0;right:0;bottom:0;height:82px;background:#fff;border-radius:12px 12px 0 0;padding:16px 14px 0;display:grid;gap:7px;align-content:start;box-sizing:border-box}
.mt-sheet .hd{position:absolute;top:6px;left:50%;width:28px;height:4px;margin-left:-14px;border-radius:2px;background:#DDD}
.mt-pick{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:6px;padding:7px 10px;background:#fff;border-radius:22px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.mt-pick span{display:block;line-height:0}
.mt-pick span>*{display:block}
.mt-like{position:absolute;inset:0;display:grid;place-items:center}
.mt-like>*{grid-area:1/1}
.mt-like .ring{width:56px;height:56px;border-radius:50%;border:2px solid #FF2442;box-sizing:border-box}
.mt-like em{width:6px;height:6px;border-radius:50%;background:#FF2442}
.mt-cmt{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);display:flex;gap:8px;align-items:flex-start}
.cards span{font-size:13px;color:#8F8F8F;line-height:1.6}
</style>
</head>
<body>
<div class="top"><b>评论区互动 · Design System</b><span>v0.6</span></div>
<div class="wrap">
<nav id="nav"></nav>
<main id="page"></main>
</div>

</body>
