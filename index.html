<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>评论区互动 Demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Single light theme by choice: the demo mirrors the app's own light UI. All colors set explicitly. */
:root{color-scheme:light;--page:#F7F7F7;--ink:#222;--mute:#8C8C8C;--mute2:#AAAAAA}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font-family:"Noto Sans SC","Noto Sans CJK SC","PingFang SC",-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
[hidden]{display:none!important}
.stage{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{width:300px;flex:none;display:flex;flex-direction:column;gap:14px;align-self:flex-start}
.rail h1{font-size:20px;font-weight:600;margin:0 0 6px 4px;line-height:1.3;letter-spacing:.01em}
.paths{display:flex;flex-direction:column;gap:6px}
.path{border-radius:14px;position:relative;z-index:1}
#paths{position:relative}
/* each section carries its own white card, so the card is always exactly the section's shape while it folds/unfolds; it fades on the same curve */
.path{background:rgba(255,255,255,0);box-shadow:0 1px 2px rgba(0,0,0,0),0 8px 24px rgba(0,0,0,0);transition:background .46s cubic-bezier(.45,0,.2,1),box-shadow .46s cubic-bezier(.45,0,.2,1)}
.path.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
.pathbtn{display:flex;gap:12px;align-items:baseline;text-align:left;padding:13px 16px;border-radius:14px;width:100%}
.path:not(.on) .pathbtn:hover{background:rgba(255,255,255,.65)}
.pathbtn .k{font-weight:600;width:24px;height:24px;border-radius:12px;background:#fff;color:#8C8C8C;display:grid;place-items:center;font-size:12px;flex:none;box-shadow:inset 0 0 0 1px #E3E4E8}
.pathbtn .rng{margin-left:auto;font-size:12px;color:var(--mute2);font-variant-numeric:tabular-nums;letter-spacing:.02em;transition:color .25s}
.path.on .pathbtn .rng{color:var(--mute)}
.pathbtn b{display:block;font-size:15px;font-weight:500;color:#222}
.path:not(.on) .pathbtn b{color:#555}
.pathbtn span span{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.pbody{height:0;overflow:hidden}
.pin{padding:2px 16px 14px}
.path .pathbtn .k,.path .pathbtn b{transition:background .25s,color .25s,box-shadow .25s}
.steps li{transition:color .25s}
.steps li::before{transition:background .25s,border-color .25s,box-shadow .3s}
.cur.in{animation:curin .46s cubic-bezier(.45,0,.2,1) .06s both}
@keyframes curin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.acts button,.restart,.pathbtn{transition:transform .1s ease-out,background .2s}
.acts button:active,.restart:active{transform:scale(.97)}
.path:not(.on) .pathbtn:active{transform:scale(.99)}
.steps{list-style:none;margin:0;padding:0}
.steps li{position:relative;padding:0 0 14px 24px;font-size:13px;line-height:20px;color:var(--mute2)}
.steps li::before{content:"";position:absolute;left:8px;top:6px;width:8px;height:8px;border-radius:50%;box-sizing:border-box;border:1.5px solid #D5D6DA;background:#fff}
.steps li:not(:last-child)::after{content:"";position:absolute;left:11.25px;top:17px;bottom:-1px;width:1.5px;background:#ECEDF0}
.steps li.done{color:var(--mute)}
.steps li.done::before{background:#C9CBD0;border-color:#C9CBD0}
.steps li.now{color:#222;font-weight:500}
.steps li.now::before{background:#FF2442;border-color:#FF2442;box-shadow:0 0 0 4px rgba(255,36,66,.14)}
.steps li.fin::before{background:#222;border-color:#222}
.steps li.fin{color:#222;font-weight:500}
.cur{box-sizing:border-box;margin-top:8px;padding:10px 12px;border-radius:10px;background:#F6F7F9;font-size:13.5px;line-height:1.55;color:#222;font-weight:400}
.cur .note{display:block;font-size:12px;color:#B26A00;margin-top:4px}
.cur .note:empty{display:none}
.stepbtn{display:block;width:100%;text-align:left;font:inherit;color:inherit;padding:0;border-radius:6px;transition:color .2s}
.stepbtn:hover{color:#222}
.steps li.now .stepbtn{cursor:default}
.ctl{display:flex;gap:14px;margin-top:10px;padding-top:9px;border-top:1px solid #E9EAEE}
.ctl button{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:#666;transition:color .2s,transform .1s ease-out}
.ctl button:hover{color:#222}
.ctl button:active{transform:scale(.97)}
.ctl:empty{display:none}
.msheet .msteps{display:flex;flex-wrap:wrap;gap:6px;padding:2px 2px 8px 16px}
.msheet .msteps button{font-size:12px;padding:5px 10px;border-radius:12px;background:#fff;border:1px solid #E3E4E8;color:#444}
.msheet .msteps button.on{border-color:#222;color:#222;font-weight:500}
.restart{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mute);margin:2px 0 0 24px;transition:color .2s,transform .1s ease-out}
.restart:hover{color:#222}
.phone{flex:none;position:relative;border-radius:46px;background:#111;padding:9px}
.screen{position:relative;overflow:hidden;background:#fff;border-radius:38px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.mbar{display:none}

.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts:empty{display:none}
.acts button{height:32px;padding:0 14px;border-radius:16px;font-size:13px;border:1px solid #DDD;background:#fff;color:#222}
.acts button.pri{background:#222;color:#fff;border-color:#222}
/* phone layout: a slim header (path + replay/skip), the phone with its frame so you can see the canvas, the next step in a card at the bottom */
.mhead{display:none}
  html.m .stage{display:flex;justify-content:center;align-items:flex-start;min-height:0;padding:6px 16px 0;gap:0}
  html.m .rail{display:none}
  html.m .mhead{display:block;position:sticky;top:0;z-index:80;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px;background:var(--page)}
  html.m .mprog{display:flex;align-items:center;justify-content:space-between;height:28px;font-size:13px;color:#222}
  html.m .mprog .pg{display:flex;align-items:center;gap:6px;margin-right:-8px}
  html.m .mprog .pg button{width:30px;height:30px;display:grid;place-items:center;color:#222;background:none;transition:transform .1s ease-out,opacity .1s}
  html.m .mprog .pg button:disabled{color:#CFCFD3}
  html.m .mprog .pg button:active:not(:disabled){transform:scale(.9);opacity:.6}
  html.m .mprog b{font-weight:500}
  html.m .mprog i{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums;font-size:12px}
  /* progress = 15 steps you can tap; a wider gap between sections */
  html.m .mtrack{display:flex;gap:7px;height:20px;margin-top:0}
  html.m .mtrack .sec{display:flex;gap:2px}
  html.m .mtrack button{flex:1;position:relative;padding:0;height:20px}
  html.m .mtrack button::before{content:'';position:absolute;left:0;right:0;top:8px;height:3px;border-radius:2px;background:#E2E3E6;transition:background .25s}
  html.m .mtrack button.done::before{background:#222}
  html.m .mtrack button:active::before{background:#999}
  html.m .mbar{display:flex;flex-direction:column;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:80;background:#fff;border-radius:14px;padding:12px 14px 10px;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.08);color:#222}
  html.m .mtitle{min-height:20px;font-size:14.5px;font-weight:500;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  html.m .mmsg{margin-top:3px;font-size:13px;line-height:19px;height:38px;color:#666;overflow:hidden}
  html.m .mmsg .mnote{color:#B26A00}
  html.m .mfoot{display:flex;align-items:center;gap:8px;margin-top:8px;height:30px}
  html.m .mfoot .acts{flex:1;min-width:0}
  html.m .mctl{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
  html.m .mctl button{display:inline-flex;align-items:center;gap:4px;height:30px;font-size:13px;color:#555;padding:0 6px}
  html.m .mctl button.next{background:#222;color:#fff;border-radius:15px;padding:0 14px;font-weight:500}
  html.m .mctl button:active{transform:scale(.96)}
  html.m .mbar .acts{margin-top:0;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none}
  html.m .mbar .acts::-webkit-scrollbar{display:none}
  html.m .mbar .acts button{flex:none;height:28px;font-size:12.5px;padding:0 12px;background:#fff;color:#222;border-color:#DADCE0}
  html.m .mbar .acts button.pri{background:#222;color:#fff;border-color:#222}
  html.m .phone{margin:0 auto;padding:6px}
/* phone layout on a computer: progress, phone and the step card as one group, centred on the screen, the card right under the phone */
html.m.wide body{display:flex;flex-direction:column;justify-content:center;min-height:100vh;min-height:100dvh;padding:40px 0;box-sizing:border-box}
html.m.wide .mhead{position:static;width:430px;max-width:100%;margin:0 auto;padding:0 12px 14px;box-sizing:border-box}
html.m.wide .stage{flex:none;padding-top:0}
html.m.wide .mbar{position:static;width:406px;margin:14px auto 0}
/* 电脑版 / 手机版 switch: only on a wide screen (a phone can't fit the desktop layout) */
.modesw{display:none;position:fixed;top:16px;right:20px;z-index:95;background:#EAEAEC;border-radius:16px;padding:2px;gap:2px}
html.wide .modesw{display:flex}
.modesw button{height:28px;padding:0 13px;border-radius:14px;font-size:12.5px;color:#666;transition:background .2s,color .2s,box-shadow .2s}
.modesw button[aria-pressed="true"]{background:#fff;color:#222;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.modesw button:active{transform:scale(.97)}
.msheet{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.msheet .box{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.msheet .pathbtn{background:#F6F6F8}
/* rendered figma layers */
.n{position:absolute;margin:0}
.t{white-space:pre}
.t.wrap{white-space:pre-wrap;word-break:break-all}
.n svg{display:block;overflow:visible}
.hot{position:absolute;z-index:40;cursor:pointer;border-radius:8px}
.layer{position:absolute;inset:0}
.dimfade{animation:fade .25s ease-out both}
.slideup{animation:up .34s cubic-bezier(.2,.8,.2,1) both}
.pushin{animation:push .32s cubic-bezier(.2,.8,.2,1) both}
.fadein{animation:fade .3s ease-out both}
.pop{animation:pop .18s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(var(--dy,100%))}to{transform:none}}
@keyframes push{from{transform:translateX(30%);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-130%)}to{transform:none}}
@keyframes blink{50%{opacity:0}}
.caret{animation:blink 1s steps(1) infinite}
/* located comment: brief light-gray flash, same as jumping to a comment in the app */
.mrow{background:#fff;color:#333;text-align:left;transition:background .12s}
.mrow:active{background:#efefef;transition:none}
.acts button.sel{border-color:#222;font-weight:500}
.qa{color:#fff;text-align:left;padding:0;overflow:hidden;background:rgba(0,0,0,.45);
  transition:width .3s cubic-bezier(.32,.72,0,1),height .3s cubic-bezier(.32,.72,0,1),border-radius .3s cubic-bezier(.32,.72,0,1),opacity .25s ease-out,transform .25s ease-out}
.qa.hide{opacity:0;transform:translateY(3px);pointer-events:none}
.qa.still{transition:none}
.qa .qa-pill{position:absolute;left:0;bottom:0;display:flex;align-items:center;white-space:nowrap;font-weight:500;transition:opacity .12s .12s}
.qa.open .qa-pill{opacity:0;transition-delay:0s}
.qa .qa-body{position:absolute;left:0;bottom:0;opacity:0;transition:opacity .12s;pointer-events:none}
.qa.open .qa-body{opacity:1;transition:opacity .16s .14s}
.qa:not(.open):active{transform:scale(.96);transition:transform .1s ease-out}
.locflash{animation:loc 1.6s ease-out both}
@keyframes loc{0%,35%{background:#F2F2F2}100%{background:rgba(242,242,242,0)}}
/* newly posted item: rows below make room, the item fades in */
.makeroom{animation:room .34s cubic-bezier(.32,.72,0,1) backwards}
@keyframes room{from{transform:translateY(var(--h))}to{transform:none}}
.newitem{animation:newin .18s .06s ease-out backwards}
/* after you mark it 「有用」, a light 关注 appears next to the 课代表 badge (the badge stays: it is the reason to follow) */
button.fol{position:absolute;display:flex;align-items:center;padding:0;background:none;color:#FF2442;white-space:nowrap;font-weight:500;transition:opacity .22s ease-out,transform .3s cubic-bezier(.32,.72,0,1),color .2s}
button.fol.off{opacity:0;transform:translateX(-4px);pointer-events:none}
button.fol.gone{opacity:0;pointer-events:none;transition:opacity .45s ease-out}
button.fol::after{content:'';position:absolute;inset:-9px -6px}
button.fol:active{transform:scale(.94)}
@keyframes newin{from{opacity:0}to{opacity:1}}
/* in-app notification: white card under the status bar, sender's avatar */
.banner{position:absolute;z-index:60;animation:drop .42s cubic-bezier(.32,.72,0,1) both;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);display:flex;align-items:center;text-align:left;cursor:pointer;width:auto}
.banner .av{flex:none;border-radius:50%;background:center/cover no-repeat}
.banner .bx{flex:1;min-width:0;display:block}
.banner .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;color:#333;white-space:nowrap}
.banner .ht{min-width:0;overflow:hidden;text-overflow:ellipsis}
.banner .hd i{flex:none}
.banner .hd b{font-weight:500}
.banner .hd i{font-style:normal;color:#999}
.banner .bd{display:block;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* reaction picker */
.pkbox{animation:pkbox .2s cubic-bezier(.2,.8,.2,1) both;transform-origin:85% 100%}
@keyframes pkbox{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.pkbox.out{animation:pkout .16s ease-in both}
@keyframes pkout{to{transform:scale(.8);opacity:0}}
.pkic{transform-origin:50% 50%;transition:transform .18s cubic-bezier(.34,1.56,.64,1);animation:pkin .34s cubic-bezier(.34,1.56,.64,1) backwards}
@keyframes pkin{from{transform:translateY(5px) scale(.2);opacity:0}}
.pkic.hov{transform:scale(1.18)} /* grows in place, stays inside the bar */
.pkic.press{transform:scale(.92);transition-duration:.08s}
.heartpress{transition:transform .2s ease-out;transform:scale(.86)}
.sc{position:absolute;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.sc::-webkit-scrollbar{display:none}
.hsc{overflow-x:auto;overflow-y:hidden;touch-action:pan-x;overscroll-behavior-x:contain}
.spin{position:absolute;z-index:45;pointer-events:none}
.spin svg{display:block;animation:spinr .9s linear infinite}
.spin circle{animation:spind 1.3s ease-in-out infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
@keyframes spind{0%{stroke-dasharray:6 100;stroke-dashoffset:0}50%{stroke-dasharray:62 100;stroke-dashoffset:-18}100%{stroke-dasharray:6 100;stroke-dashoffset:-94}}
.imgin{animation:fade .22s ease-out backwards}
.likepop{animation:likepop .42s cubic-bezier(.2,.7,.3,1) both}
@keyframes likepop{0%{transform:scale(.3)}40%{transform:scale(1.22)}70%{transform:scale(.96)}100%{transform:none}}
.unpop{animation:unpop .22s ease-out both}
@keyframes unpop{0%{transform:scale(.6)}100%{transform:none}}
.burst-ring{border-radius:50%;animation:ring .5s cubic-bezier(.25,.6,.35,1) both;pointer-events:none}
@keyframes ring{0%{transform:scale(.35);opacity:1}32%{transform:scale(1);opacity:1}100%{transform:scale(1.8);opacity:0}}
.spark{border-radius:9px;animation:spark .45s cubic-bezier(.25,.6,.35,1) both;pointer-events:none}
@keyframes spark{0%{transform:rotate(var(--a)) translateY(calc(var(--r)*.4)) scaleY(.4);opacity:0}25%{opacity:1}100%{transform:rotate(var(--a)) translateY(var(--r)) scaleY(1);opacity:0}}
.end{position:absolute;inset:0;z-index:95;background:rgba(255,255,255,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;animation:fade .3s both}
.end h2{font-size:19px;margin:0;font-weight:500}
.end p{font-size:13px;color:var(--mute);margin:0 0 8px;line-height:1.6;max-width:260px}
.end .row{display:flex;gap:10px}
.end .row button{height:38px;padding:0 18px;border-radius:19px;font-size:14px;border:1px solid #DDD}
.end .row button.pri{background:#222;color:#fff;border-color:#222}
.toast{position:absolute;z-index:70;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;border-radius:8px;white-space:nowrap;animation:fade .2s both;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
button:focus-visible,.hot:focus-visible{outline:2px solid #3478F6;outline-offset:2px}
</style>

<div class="modesw" role="group" aria-label="切换 Demo 版本"><button data-m="desktop">电脑版</button><button data-m="phone">手机版</button></div>
<div class="mhead" id="mhead"><div class="mprog" id="mprog"></div><div class="mtrack" id="mtrack" aria-label="跳到某一步"></div></div>
<div class="stage">
  <aside class="rail" aria-label="Demo 导航">
    <h1>评论区互动 Demo</h1>
    <div class="paths" id="paths"></div>
  </aside>
  <div class="phone" id="phone"><div class="screen" id="screen"></div></div>
</div>
<div class="mbar" id="mbar"><div class="mtitle" id="mtitle"></div><div class="mmsg" id="mmsg" aria-live="polite"></div><div class="mfoot"><div class="acts" id="macts"></div><div class="mctl" id="mctl"></div></div></div>

function fit(){applyMode();const compact=document.documentElement.classList.contains('m');const touch=compact&&matchMedia('(pointer:coarse)').matches;
  document.documentElement.classList.toggle('touch',touch);MOBILE=false;

// size change (window, the viewer sheet opening, an iframe getting its size late): re-fit and reopen the same step
let rz,lastW=innerWidth,lastH=innerHeight,BOOTED=false;
